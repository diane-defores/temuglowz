[package]
name = "app"
version = "0.1.0"
description = "Temu shopping lists local-first app"
publish = false
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0", features = ["unstable"] }
tauri-plugin-android-temu-webview = { path = "plugins/android-temu-webview" }
